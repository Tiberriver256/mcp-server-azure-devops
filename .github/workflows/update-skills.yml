name: Update Skills

on:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone anthropics/skills repository
        run: |
          git clone --depth 1 https://github.com/anthropics/skills.git /tmp/skills

      - name: Update skill-creator skill
        run: |
          # anthropics/skills moved example skills under skills/ (PR #129, Dec 2025).
          SRC=/tmp/skills/skills/skill-creator
          if [ ! -d "$SRC" ]; then
            echo "Expected skill-creator at $SRC; repo layout:"
            find /tmp/skills -maxdepth 3 -type d -print
            exit 1
          fi

          rm -rf .github/skills/skill-creator
          mkdir -p .github/skills
          cp -r "$SRC" .github/skills/

      - name: Update copilot-instructions.md
        run: |
          node -e '
            const fs = require("fs");
            const skillPath = ".github/skills/skill-creator/SKILL.md";
            const instructionsPath = ".github/copilot-instructions.md";

            const skillContent = fs.readFileSync(skillPath, "utf8");
            const fmMatch = skillContent.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!fmMatch) {
              throw new Error("Missing YAML frontmatter in " + skillPath);
            }

            const lines = fmMatch[1].split(/\r?\n/);
            let description = "";
            let capturing = false;
            for (const line of lines) {
              if (!capturing) {
                const descMatch = line.match(/^description:\s*(.*)$/);
                if (descMatch) {
                  const val = descMatch[1].trim();
                  if (val && val !== "|" && val !== ">") {
                    description = val.replace(/^["\x27]|["\x27]$/g, "");
                    break;
                  }
                  capturing = true;
                }
              } else if (/^\s+/.test(line)) {
                description += (description ? " " : "") + line.trim();
              } else {
                break;
              }
            }

            description = description.replace(/\|/g, "\\|").replace(/\s+/g, " ").trim();
            if (!description) {
              throw new Error("Could not extract description from " + skillPath);
            }

            const newRow = `| skill-creator | ${description} | [skills/skill-creator/SKILL.md](skills/skill-creator/SKILL.md) |`;
            const instructions = fs.readFileSync(instructionsPath, "utf8");
            const updated = instructions.replace(/^\| skill-creator \|.*$/m, () => newRow);
            if (updated === instructions && !instructions.includes(newRow)) {
              throw new Error("Could not find skill-creator table row in " + instructionsPath);
            }
            fs.writeFileSync(instructionsPath, updated, "utf8");
          '

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet .github/skills .github/copilot-instructions.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(skills): update skill-creator from anthropics/skills'
          title: 'Update skill-creator skill'
          body: |
            This PR updates the skill-creator skill from the [anthropics/skills](https://github.com/anthropics/skills) repository.

            **Changes:**
            - Updated skill-creator skill files
            - Updated .github/copilot-instructions.md metadata table

            This is an automated update triggered by the update-skills workflow.
          branch: update-skills
          delete-branch: true
          labels: |
            chore
            automated
