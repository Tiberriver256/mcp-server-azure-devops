name: Restore package-lock
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependabot-majors
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Regenerate package-lock.json
        run: npm install
      - name: Commit and push package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "No package-lock.json changes"
            exit 0
          fi
          git commit -m "chore(deps): regenerate package-lock.json for zod 4 + jest 30"
          git push origin HEAD:fix/dependabot-majors
