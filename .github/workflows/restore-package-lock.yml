name: Restore package-lock
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to regenerate package-lock.json on
        required: true
        default: fix/dependabot-majors
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Regenerate package-lock.json
        run: npm install
      - name: Commit and push package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # remove one-shot workflow on the feature branch if present
          rm -f .github/workflows/restore-package-lock.yml
          git add package-lock.json
          git add -u .github/workflows/restore-package-lock.yml || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(deps): regenerate package-lock.json for zod 4 + jest 30"
          git push origin HEAD:${{ inputs.target_branch }}
